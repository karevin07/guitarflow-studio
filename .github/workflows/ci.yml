name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv sync
      - run: uv run python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated test stack
        run: docker compose --env-file .env.e2e.example -p guitarflow-ci-e2e up -d --build --wait --wait-timeout 180
      - name: Wait for frontend
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:3303/
      - name: Run browser tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show test-stack logs on failure
        if: failure()
        run: docker compose --env-file .env.e2e.example -p guitarflow-ci-e2e logs --tail=120
      - name: Remove isolated test stack
        if: always()
        run: docker compose --env-file .env.e2e.example -p guitarflow-ci-e2e down -v --remove-orphans
