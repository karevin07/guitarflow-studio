
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuitarFlow Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
    }
    html.dark {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f7f5ef;
      color: #171a18;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    html.dark body {
      background-color: #0c0c0d;
      color: #f4f4f5;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    h1, h2, h3, .font-display {
      font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif;
    }
    button, input, select {
      font: inherit;
    }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #4d5bd2;
      outline-offset: 2px;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      header, 
      aside, 
      button, 
      nav,
      .print\:hidden {
        display: none !important;
      }
      main {
        display: block !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }
      .bg-white\/85, 
      .bg-zinc-900\/20, 
      .dark\:bg-zinc-900\/20 {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        backdrop-filter: none !important;
      }
      .flex-1 {
        width: 100% !important;
        max-w-100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .bg-slate-50\/50, 
      .dark\:bg-zinc-955\/45 {
        background-color: #fafafa !important;
        border: 1px solid #e2e8f0 !important;
      }
      .bg-slate-50\/20, 
      .dark\:bg-zinc-955\/10 {
        background-color: transparent !important;
      }
      .bg-white, 
      .dark\:bg-zinc-950 {
        background-color: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
      }
      span, h2, h3, h4 {
        color: #000000 !important;
      }
      .text-indigo-650, 
      .dark\:text-violet-405,
      .text-indigo-600,
      .dark\:text-violet-400 {
        color: #4f46e5 !important;
      }
      .svguitar-container svg {
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
