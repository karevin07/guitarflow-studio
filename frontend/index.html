
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuitarFlow Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
      color: #1f2937;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    html.dark body {
      background-color: #09090b;
      color: #f4f4f5;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #18181b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      header, 
      aside, 
      button, 
      nav,
      .print\:hidden {
        display: none !important;
      }
      main {
        display: block !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }
      .bg-white\/85, 
      .bg-zinc-900\/20, 
      .dark\:bg-zinc-900\/20 {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        backdrop-filter: none !important;
      }
      .flex-1 {
        width: 100% !important;
        max-w-100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .bg-slate-50\/50, 
      .dark\:bg-zinc-955\/45 {
        background-color: #fafafa !important;
        border: 1px solid #e2e8f0 !important;
      }
      .bg-slate-50\/20, 
      .dark\:bg-zinc-955\/10 {
        background-color: transparent !important;
      }
      .bg-white, 
      .dark\:bg-zinc-950 {
        background-color: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
      }
      span, h2, h3, h4 {
        color: #000000 !important;
      }
      .text-indigo-650, 
      .dark\:text-violet-405,
      .text-indigo-600,
      .dark\:text-violet-400 {
        color: #4f46e5 !important;
      }
      .svguitar-container svg {
        filter: none !important;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
